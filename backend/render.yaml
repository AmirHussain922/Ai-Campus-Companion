# Render deployment configuration for AI Campus Companion Backend
apiVersion: render.com/v1
type: web
name: ai-campus-backend
env: python
buildCommand: pip install -r requirements.txt
startCommand: bash render_start.sh
envVars:
  - key: PYTHON_VERSION
    value: "3.12"
  - key: MONGODB_URI
    sync: false
  - key: SECRET_KEY
    sync: false
  - key: OPENROUTER_API_KEY
    sync: false
  - key: CORS_ORIGINS
    sync: false
  - key: APP_NAME
    value: "AI Campus Companion"
  - key: APP_ENV
    value: "production"
  - key: DEBUG
    value: "false"
  - key: PORT
    value: "8002"
